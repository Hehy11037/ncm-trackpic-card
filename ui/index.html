<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Now Playing</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/card.css" />
  </head>
  <body>
    <!--
      Fixed 9:16 stage, scaled to fit the viewport and centred. Everything inside is
      written in `--u` (1% of the stage width), so the composition is identical in a
      browser window and in the desktop shell.

      Positions are measured from the reference image, not estimated:
        node tools/measure-reference.mjs <reference.png>   reads the reference pixels
        node tools/check-layout.mjs                        verifies this stylesheet

      Layout, top to bottom: cover (85.93u square), title, artist, progress bar with
      times, transport controls, colour band with hex codes, credit.

      The colour band doubles as the background picker: clicking a segment paints the
      card with that colour, clicking the active one returns to the default surface.
    -->
    <!--
      The stage is the card's box plus the transparent margin that holds the floating
      shadow. `data-mode` switches between the full card and the rolled-up mini bar; it is
      derived from the window's height by ui/src/layout.js, so the two cannot disagree.
    -->
    <div class="stage" id="stage" data-mode="expanded">
      <!--
        Shown only if the module graph fails to run. Without it a startup error looks
        exactly like "nothing is playing", which is the most confusing failure mode
        this page has had. main.js clears it as soon as it renders.
      -->
      <div class="boot-error" id="boot-error" hidden>
        <strong>界面脚本没能启动</strong>
        <span id="boot-error-detail">按 F12 查看 Console 的报错</span>
      </div>

      <main id="card" class="card" data-face="front" data-bg="glass" aria-live="polite">
        <section class="face face--front" id="face-front">
          <div class="cover-wrap">
            <img class="cover" id="cover" alt="" decoding="async" crossorigin="anonymous" />
            <div class="cover-fallback" id="cover-fallback" aria-hidden="true"></div>
          </div>

          <h1 class="title" id="title">未检测到播放</h1>
          <p class="artist" id="artist">等待网易云音乐</p>

          <div class="progress" id="progress">
            <!--
              The track is the seek target, not a display element: it carries the pointer
              handlers, and its ::before stretches the hit area vertically so the bar can
              actually be grabbed (it is only ~6px tall at the default card size).
            -->
            <div
              class="progress-track"
              id="progress-track"
              role="slider"
              aria-label="播放进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              tabindex="0"
            >
              <div class="progress-fill" id="progress-fill"></div>
              <div class="progress-thumb" id="progress-thumb" aria-hidden="true"></div>
            </div>
            <div class="progress-times">
              <span id="time-now">0:00</span>
              <span id="time-total">0:00</span>
            </div>
          </div>

          <div class="controls" id="controls">
            <!--
              Left: play mode, which the card changes by cycling the client's own four modes.
              Centre: previous / play / next, kept together so the play button stays the
              reference's centrepiece. Right: volume, with a drag bar revealed on hover.
              The two side slots are the same width, which is what keeps the centre group
              centred on the card rather than merely spaced between two edges.
            -->
            <div class="controls__side">
              <button
                class="ctrl ctrl--mode"
                id="mode"
                data-action="mode"
                data-mode="playOrder"
                title="顺序播放"
                aria-label="播放模式"
              >
                <svg class="mode-icon mode-icon--order" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 5h13v2H4zM4 11h13v2H4zM4 17h8v2H4z" />
                  <path d="M17.6 13.2 22 17l-4.4 3.8v-2.5h-2.4v-2.6h2.4z" />
                </svg>
                <svg class="mode-icon mode-icon--cycle" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7.5 6.5h8.9l-1.7-1.7 1.5-1.5 4.2 4.2-4.2 4.2-1.5-1.5 1.7-1.7H7.5A2.5 2.5 0 0 0 5 11H2.5a5 5 0 0 1 5-4.5z" />
                  <path d="M16.5 17.5H7.6l1.7 1.7-1.5 1.5L3.6 16.5l4.2-4.2 1.5 1.5-1.7 1.7h8.9A2.5 2.5 0 0 0 19 13h2.5a5 5 0 0 1-5 4.5z" />
                </svg>
                <svg class="mode-icon mode-icon--single" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7.5 5.5h8.9L14.7 3.8l1.5-1.5 4.2 4.2-4.2 4.2-1.5-1.5 1.7-1.7H7.5A2.5 2.5 0 0 0 5 10H2.5a5 5 0 0 1 5-4.5z" />
                  <path d="M16.5 18.5H7.6l1.7 1.7-1.5 1.5L3.6 17.5l4.2-4.2 1.5 1.5-1.7 1.7h8.9A2.5 2.5 0 0 0 19 14h2.5a5 5 0 0 1-5 4.5z" />
                  <path d="M10.4 14.4h1.7V9.6l-1.6.5V8.7l1.8-.7h1.4v6.4h1.6v1.3h-4.9z" />
                </svg>
                <svg class="mode-icon mode-icon--random" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 6h3.4l3.1 4-1.3 1.7L5.4 8H3zM3 16h2.4l7.3-9.4H17V4.2L21.4 8 17 11.8V9.4h-3.6l-7.3 9.4H3z" />
                  <path d="M16.6 14.6h-3.1l1.3-1.7h1.8V10.5L21.4 14.3 16.6 18z" />
                </svg>
              </button>
            </div>

            <div class="controls__center">
              <button class="ctrl" data-action="previous" title="上一首" aria-label="上一首">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z" /></svg>
              </button>
              <button class="ctrl ctrl--primary" data-action="playPause" title="播放/暂停" aria-label="播放/暂停">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z" /></svg>
              </button>
              <button class="ctrl" data-action="next" title="下一首" aria-label="下一首">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z" /></svg>
              </button>
            </div>

            <div class="controls__side controls__volume" id="volume-wrap">
              <button
                class="ctrl ctrl--volume"
                id="volume"
                data-action="mute"
                data-level="high"
                title="音量（点击静音）"
                aria-label="音量"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path class="speaker" d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" />
                  <path class="wave wave--1" d="M14.6 9.6a3.6 3.6 0 0 1 0 4.8" />
                  <path class="wave wave--2" d="M17 7.4a6.8 6.8 0 0 1 0 9.2" />
                  <path class="cross" d="M15.3 9.9 16.7 8.5l4.6 4.6-1.4 1.4zM21.3 9.9l-1.4-1.4-4.6 4.6 1.4 1.4z" />
                </svg>
              </button>
              <!-- Revealed on hover; kept in the DOM so the drag can start without waiting. -->
              <div class="volume-pop" id="volume-pop">
                <span class="volume-pop__value" id="volume-value">50</span>
                <div
                  class="volume-bar"
                  id="volume-bar"
                  role="slider"
                  aria-label="音量"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="50"
                  tabindex="0"
                >
                  <div class="volume-bar__fill" id="volume-fill"></div>
                  <div class="volume-bar__thumb" id="volume-thumb" aria-hidden="true"></div>
                </div>
              </div>
            </div>
          </div>


          <div class="foot">
            <div class="band" id="palette" role="group" aria-label="背景色"></div>
            <div class="band-labels" id="palette-labels" aria-hidden="true"></div>
            <span class="credit" id="credit">NCM · TRACKPIC CARD</span>
          </div>
        </section>

        <section class="face face--back" id="face-back">
          <div class="lyrics" id="lyrics">
            <div class="lyrics-empty" id="lyrics-empty">歌词尚未就绪</div>
          </div>
        </section>

        <!--
          Flip top-left, lock and close on the right, mirroring QQ's window controls.
          They are revealed on hover; the card is only on screen while the pointer is over
          it, so hover is always available when they can be clicked.
        -->
        <div class="top-bar">
          <button class="icon-btn icon-btn--flip" id="flip" title="翻面（F）" aria-label="翻面">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5V2L7 6l5 4V7a5 5 0 0 1 4.6 7h2.1A7 7 0 0 0 12 5zm0 12a5 5 0 0 1-4.6-7H5.3A7 7 0 0 0 12 19v3l5-4-5-4z" />
            </svg>
          </button>
          <div class="top-bar__right">
            <button class="icon-btn" id="lock" title="锁定：不自动收起（L）" aria-label="锁定" aria-pressed="false">
              <svg class="icon-unlocked" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17 9h-1V7A4 4 0 0 0 8.2 6.1l1.8.8A2.2 2.2 0 0 1 14 7v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zm0 9H7v-7h10z" />
              </svg>
              <svg class="icon-locked" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17 9h-1V7A4 4 0 0 0 8 7v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4zM17 18H7v-7h10z" />
              </svg>
            </button>
            <button class="icon-btn" id="close" title="关闭到托盘" aria-label="关闭到托盘">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="status" id="status"><span class="dot"></span><span id="status-text">连接中…</span></div>
      </main>

      <!--
        Rolled up: cover, track and progress in one strip. There is nothing to click except
        the expand handle - moving the pointer onto the bar expands it again, and the shell
        watches the pointer so the whole strip is a hover target.
      -->
      <div class="mini" id="mini">
        <img class="mini__cover" id="mini-cover" alt="" decoding="async" crossorigin="anonymous" />
        <div class="mini__text">
          <span class="mini__title" id="mini-title">未检测到播放</span>
          <span class="mini__artist" id="mini-artist">等待网易云音乐</span>
        </div>
        <button class="mini-action" id="mini-expand" title="展开" aria-label="展开">
          <!-- Points down: the card unfolds downwards from the top edge the bar sits on. -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16.5 4.5 9h15z" /></svg>
        </button>
        <div class="mini__progress"><div class="mini__fill" id="mini-fill"></div></div>
      </div>
    </div>

    <script>
      // Boot watchdog: the app sets __booted once it has rendered. If it never does,
      // the page says so rather than looking idle.
      window.__booted = false;
      window.__bootFail = (message) => {
        const box = document.getElementById('boot-error');
        const detail = document.getElementById('boot-error-detail');
        if (!box) return;
        box.hidden = false;
        if (detail && message) detail.textContent = message;
      };
      window.addEventListener('error', (event) => {
        if (!window.__booted) window.__bootFail(String(event.message || event.error || '未知错误'));
      });
      window.addEventListener('unhandledrejection', (event) => {
        if (!window.__booted) {
          window.__bootFail(`未处理的 Promise 错误: ${String(event.reason || 'unknown')}`);
        }
      });
      setTimeout(() => {
        if (!window.__booted) {
          window.__bootFail('3 秒内没有启动完成，可能是模块加载失败或脚本抛错（按 F12 看 Console）');
        }
      }, 3000);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
